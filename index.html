<!DOCTYPE html>
<html lang="es" class="dark">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <meta name="description"
        content="Tracker minimalista de gimnasio para registrar entrenamientos de hipertrofia y rendimiento atlético." />
    <title>GymTracker Pro</title>

    <!-- PWA / Web App Manifest e iOS -->
    <link rel="manifest" href="manifest.json" />
    <link rel="apple-touch-icon" href="icon.svg" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="GymTracker" />

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        neon: '#39FF14',
                        accent: '#F97316',
                        surface: '#1c1c1e',
                        card: '#2c2c2e',
                        border: '#3a3a3c',
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap"
        rel="stylesheet" />

    <style>
        * {
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #000000;
        }

        /* Ocultar scrollbar en WebKit */
        ::-webkit-scrollbar {
            width: 4px;
        }

        ::-webkit-scrollbar-track {
            background: #1c1c1e;
        }

        ::-webkit-scrollbar-thumb {
            background: #3a3a3c;
            border-radius: 4px;
        }

        /* Animación del temporizador */
        @keyframes pulse-ring {
            0% {
                box-shadow: 0 0 0 0 rgba(57, 255, 20, 0.4);
            }

            70% {
                box-shadow: 0 0 0 14px rgba(57, 255, 20, 0);
            }

            100% {
                box-shadow: 0 0 0 0 rgba(57, 255, 20, 0);
            }
        }

        .timer-active {
            animation: pulse-ring 1.5s infinite;
        }

        @keyframes flash-red {

            0%,
            100% {
                background-color: #1c1c1e;
            }

            50% {
                background-color: #7f1d1d;
            }
        }

        .timer-warning {
            animation: flash-red 0.8s infinite;
        }

        /* Select custom dark */
        select {
            background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 20 20'%3e%3cpath stroke='%239ca3af' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.5' d='M6 8l4 4 4-4'/%3e%3c/svg%3e");
            background-position: right 0.75rem center;
            background-repeat: no-repeat;
            background-size: 1.5em 1.5em;
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
        }
    </style>
</head>

<body class="dark font-sans text-gray-100 min-h-screen">

    <div class="max-w-md mx-auto px-4 pb-10 pt-6 min-h-screen flex flex-col gap-5">

        <!-- ─── HEADER ─── -->
        <header class="flex items-center justify-between">
            <div>
                <h1 class="text-2xl font-black tracking-tight text-white">💪 GymTracker</h1>
                <p id="fecha-hoy" class="text-xs text-gray-500 mt-0.5"></p>
            </div>
        </header>

        <!-- ─── SELECTORES ─── -->
        <section class="bg-card rounded-2xl p-4 flex flex-col gap-3 border border-border">
            <!-- Selector de Fase -->
            <div>
                <label for="sel-fase"
                    class="text-xs font-semibold text-gray-400 uppercase tracking-widest mb-1.5 block">Fase de
                    Entrenamiento</label>
                <select id="sel-fase" onchange="onFaseChange()"
                    class="w-full bg-surface text-white border border-border rounded-xl px-4 py-3 text-sm sm:text-base font-semibold focus:outline-none focus:ring-2 focus:ring-neon/50">
                    <option value="Fase 1: Adaptación y Base (1 mes)">Fase 1: Adaptación y Base (1 mes)</option>
                    <option value="Fase 2: Fuerza e Hipertrofia (2 meses)">Fase 2: Fuerza e Hipertrofia (2 meses)
                    </option>
                    <option value="Fase 3: Atleta Pro / Mantenimiento (Permanente)">Fase 3: Atleta Pro (Permanente)
                    </option>
                </select>
            </div>

            <!-- Selector de Día y Lugar -->
            <div>
                <label for="sel-dia"
                    class="text-xs font-semibold text-gray-400 uppercase tracking-widest mb-1.5 block">Día de
                    Entrenamiento</label>
                <select id="sel-dia" onchange="onDiaChange()"
                    class="w-full bg-surface text-white border border-border rounded-xl px-4 py-3 text-base font-semibold focus:outline-none focus:ring-2 focus:ring-neon/50">
                    <option value="" disabled selected>— Seleccionar Día —</option>
                    <option value="Día 1: Lower 1">Día 1: Lower 1</option>
                    <option value="Día 2: Upper 1">Día 2: Upper 1</option>
                    <option value="Día 3: Lower 2">Día 3: Lower 2</option>
                    <option value="Día 4: Upper 2">Día 4: Upper 2</option>
                </select>
                <p id="lugar-indicador"
                    class="text-xs font-bold mt-2 px-3 py-1.5 bg-surface border border-border rounded-lg inline-block text-accent hidden">
                    📍 Lugar: </p>
            </div>

            <!-- Selector de Ejercicio -->
            <div>
                <label for="sel-ejercicio"
                    class="text-xs font-semibold text-gray-400 uppercase tracking-widest mb-1.5 block">Ejercicio</label>
                <select id="sel-ejercicio" onchange="onEjercicioChange()"
                    class="w-full bg-surface text-white border border-border rounded-xl px-4 py-3 text-sm font-semibold focus:outline-none focus:ring-2 focus:ring-neon/50 disabled:opacity-40"
                    disabled>
                    <option value="" disabled selected>— Primero elige un día —</option>
                </select>
            </div>
        </section>

        <!-- ─── CONTROLES PESO & REPS ─── -->
        <section class="bg-card rounded-2xl p-4 border border-border transition-all">
            <div id="controles-grid" class="grid grid-cols-2 gap-4">

                <!-- Peso -->
                <div id="contenedor-peso" class="flex flex-col items-center gap-2">
                    <span class="text-xs font-semibold text-gray-400 uppercase tracking-widest">Peso (kg)</span>
                    <div class="flex items-center gap-3 w-full justify-center">
                        <button id="btn-peso-menos" onclick="ajustar('peso', -2.5)"
                            class="w-14 h-14 rounded-2xl bg-surface border border-border text-2xl font-black text-accent active:scale-95 transition-transform flex items-center justify-center">>−</button>
                        <span id="val-peso" class="text-3xl font-black text-white w-16 text-center">60</span>
                        <button id="btn-peso-mas" onclick="ajustar('peso', 2.5)"
                            class="w-14 h-14 rounded-2xl bg-surface border border-border text-2xl font-black text-neon active:scale-95 transition-transform flex items-center justify-center">+</button>
                    </div>
                    <span class="text-xs text-gray-500">±2.5 kg</span>
                </div>

                <!-- Repeticiones -->
                <div id="contenedor-reps" class="flex flex-col items-center gap-2">
                    <span class="text-xs font-semibold text-gray-400 uppercase tracking-widest">Reps</span>
                    <div class="flex items-center gap-3 w-full justify-center">
                        <button id="btn-reps-menos" onclick="ajustar('reps', -1)"
                            class="w-14 h-14 rounded-2xl bg-surface border border-border text-2xl font-black text-accent active:scale-95 transition-transform flex items-center justify-center">>−</button>
                        <span id="val-reps" class="text-3xl font-black text-white w-16 text-center">10</span>
                        <button id="btn-reps-mas" onclick="ajustar('reps', 1)"
                            class="w-14 h-14 rounded-2xl bg-surface border border-border text-2xl font-black text-neon active:scale-95 transition-transform flex items-center justify-center">+</button>
                    </div>
                    <span class="text-xs text-gray-500">±1 rep</span>
                </div>

            </div>
        </section>

        <!-- ─── BOTÓN COMPLETAR SERIE ─── -->
        <button id="btn-completar" onclick="completarSerie()"
            class="w-full py-5 rounded-2xl bg-neon text-gray-900 text-xl font-black tracking-tight active:scale-95 transition-transform shadow-lg shadow-green-900/40 disabled:opacity-40 disabled:cursor-not-allowed"
            disabled>
            ✅ Completar Serie
        </button>

        <!-- ─── TEMPORIZADOR ─── -->
        <section id="timer-section"
            class="bg-card rounded-2xl border border-border p-5 flex flex-col items-center gap-4">
            <h2 class="text-xs font-semibold text-gray-400 uppercase tracking-widest self-start">⏱ Descanso</h2>
            <div id="timer-display"
                class="w-36 h-36 rounded-full bg-surface border-4 border-border flex items-center justify-center transition-all">
                <span id="timer-texto" class="text-5xl font-black text-white tabular-nums">90</span>
            </div>
            <div class="flex gap-2">
                <button onclick="setTimer(60)"
                    class="flex-1 px-4 py-2 rounded-xl bg-surface border border-border text-sm font-bold text-gray-300 active:bg-border transition-colors">60s</button>
                <button onclick="setTimer(90)"
                    class="flex-1 px-4 py-2 rounded-xl bg-surface border border-border text-sm font-bold text-gray-300 active:bg-border transition-colors">90s</button>
                <button onclick="setTimer(120)"
                    class="flex-1 px-4 py-2 rounded-xl bg-surface border border-border text-sm font-bold text-gray-300 active:bg-border transition-colors">120s</button>
            </div>
            <p class="text-xs text-gray-600 text-center">El temporizador inicia automáticamente al completar una serie y
                se auto-configura según el ejercicio.</p>
        </section>

        <!-- ─── HISTORIAL DEL DÍA ─── -->
        <section>
            <div class="flex items-center justify-between mb-3">
                <h2 class="text-xs font-semibold text-gray-400 uppercase tracking-widest">📋 Historial de Hoy</h2>
                <button onclick="confirmarBorrarHistorial()"
                    class="text-xs text-red-500 hover:text-red-400 transition-colors font-semibold">Borrar todo</button>
            </div>
            <div id="historial-lista" class="flex flex-col gap-2"></div>
            <p id="historial-empty" class="text-center text-gray-600 text-sm py-6 hidden">
                Aún no hay series registradas hoy. ¡A entrenar!
            </p>
        </section>
    </div>

    <!-- ─── TOAST ─── -->
    <div id="toast"
        class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-neon text-gray-900 text-sm font-bold px-5 py-3 rounded-2xl shadow-xl opacity-0 pointer-events-none transition-opacity duration-300 z-50">
    </div>

    <!-- ─── SCRIPT PRINCIPAL ─── -->
    <script>
        /* ══════════════ BASE DE DATOS INTELIGENTE ══════════════ */
        const RUTINAS = {
            "Fase 1: Adaptación y Base (1 mes)": {
                "Día 1: Lower 1": [
                    { nombre: "Sentadilla Búlgara", peso: true, descanso: 120 },
                    { nombre: "Peso Muerto Rumano con mancuernas", peso: true, descanso: 120 },
                    { nombre: "Extensión de Cuádriceps", peso: true, descanso: 60 },
                    { nombre: "Curl de Isquiotibiales", peso: true, descanso: 60 },
                    { nombre: "Elevación de Talón a 1 pierna", peso: true, descanso: 60 }
                ],
                "Día 2: Upper 1": [
                    { nombre: "Press Inclinado con mancuernas", peso: true, descanso: 120 },
                    { nombre: "Dominadas estrictas", peso: false, descanso: 120 },
                    { nombre: "Remo en polea/mancuerna", peso: true, descanso: 90 },
                    { nombre: "Face Pull", peso: true, descanso: 60 },
                    { nombre: "Elevaciones Laterales", peso: true, descanso: 60 },
                    { nombre: "Curl de Bíceps alterno", peso: true, descanso: 60 }
                ],
                "Día 3: Lower 2": [
                    { nombre: "Saltos a Cajón", peso: false, descanso: 120 },
                    { nombre: "Kettlebell Swings", peso: true, descanso: 90 },
                    { nombre: "Zancadas Laterales (Lateral Lunges)", peso: true, descanso: 90 },
                    { nombre: "Plancha abdominal", peso: false, descanso: 60 }
                ],
                "Día 4: Upper 2": [
                    { nombre: "Press Plano con mancuernas", peso: true, descanso: 120 },
                    { nombre: "Jalón al pecho (Polea)", peso: true, descanso: 90 },
                    { nombre: "Press Militar sentado", peso: true, descanso: 90 },
                    { nombre: "Extensión de Tríceps (Cuerda)", peso: true, descanso: 60 },
                    { nombre: "Curl Martillo para Bíceps", peso: true, descanso: 60 }
                ]
            },
            "Fase 2: Fuerza e Hipertrofia (2 meses)": {
                "Día 1: Lower 1": [
                    { nombre: "Prensa de Piernas (Leg Press)", peso: true, descanso: 120 },
                    { nombre: "Peso Muerto Rumano con barra", peso: true, descanso: 120 },
                    { nombre: "Extensión de Cuádriceps", peso: true, descanso: 60 },
                    { nombre: "Curl de Isquiotibiales", peso: true, descanso: 60 },
                    { nombre: "Elevación de talones (Máquina)", peso: true, descanso: 60 }
                ],
                "Día 2: Upper 1": [
                    { nombre: "Press de Banca con barra", peso: true, descanso: 120 },
                    { nombre: "Dominadas", peso: false, descanso: 120 },
                    { nombre: "Remo con barra", peso: true, descanso: 90 },
                    { nombre: "Face Pull", peso: true, descanso: 60 },
                    { nombre: "Elevación Lateral con mancuernas", peso: true, descanso: 60 }
                ],
                "Día 3: Lower 2": [
                    { nombre: "Saltos a Cajón (Alto)", peso: false, descanso: 120 },
                    { nombre: "Sentadilla Búlgara pesada", peso: true, descanso: 120 },
                    { nombre: "Kettlebell Swings Pesados", peso: true, descanso: 90 },
                    { nombre: "Zancadas Laterales (Lateral Lunges)", peso: true, descanso: 90 },
                    { nombre: "Plancha abdominal con peso", peso: true, descanso: 60 }
                ],
                "Día 4: Upper 2": [
                    { nombre: "Press Inclinado con mancuernas", peso: true, descanso: 120 },
                    { nombre: "Jalón al Pecho", peso: true, descanso: 90 },
                    { nombre: "Press Militar sentado", peso: true, descanso: 90 },
                    { nombre: "Curl de Bíceps alterno", peso: true, descanso: 60 },
                    { nombre: "Extensión de Tríceps en polea", peso: true, descanso: 60 }
                ]
            },
            "Fase 3: Atleta Pro / Mantenimiento (Permanente)": {
                "Día 1: Lower 1": [
                    { nombre: "Sentadilla Libre con barra", peso: true, descanso: 120 },
                    { nombre: "Peso Muerto Rumano pesado", peso: true, descanso: 120 },
                    { nombre: "Sentadilla Búlgara", peso: true, descanso: 120 },
                    { nombre: "Elevación de talones pesada", peso: true, descanso: 60 }
                ],
                "Día 2: Upper 1": [
                    { nombre: "Press de Banca Inclinado con barra", peso: true, descanso: 120 },
                    { nombre: "Dominadas con lastre", peso: true, descanso: 120 },
                    { nombre: "Remo con barra", peso: true, descanso: 90 },
                    { nombre: "Face Pull", peso: true, descanso: 60 },
                    { nombre: "Elevaciones Laterales", peso: true, descanso: 60 }
                ],
                "Día 3: Lower 2": [
                    { nombre: "Saltos de profundidad (Depth Jumps)", peso: false, descanso: 120 },
                    { nombre: "Push Press con barra/mancuernas", peso: true, descanso: 120 },
                    { nombre: "Zancadas Laterales", peso: true, descanso: 90 },
                    { nombre: "Kettlebell Swings", peso: true, descanso: 90 }
                ],
                "Día 4: Upper 2": [
                    { nombre: "Press Plano", peso: true, descanso: 120 },
                    { nombre: "Jalón al Pecho pesado", peso: true, descanso: 90 },
                    { nombre: "Press Arnold", peso: true, descanso: 90 },
                    { nombre: "Superserie: Curl Bíceps + Ext. Tríceps", peso: true, descanso: 60 }
                ]
            }
        };

        /* ══════════════ ESTADO ══════════════ */
        let peso = 60, reps = 10;
        let timerSeg = 90, timerDefault = 90, timerInterval = null, timerRunning = false;

        /* ══════════════ FECHA HOY ══════════════ */
        function fechaHoy() { return new Date().toISOString().split('T')[0]; }
        function mostrarFecha() {
            document.getElementById('fecha-hoy').textContent = new Date().toLocaleDateString('es-ES', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
        }

        /* ══════════════ LÓGICA DE SELECTORES ══════════════ */
        function onFaseChange() { onDiaChange(); }

        function onDiaChange() {
            const fase = document.getElementById('sel-fase').value;
            const dia = document.getElementById('sel-dia').value;
            const selEj = document.getElementById('sel-ejercicio');
            const lugarIndicador = document.getElementById('lugar-indicador');

            // Indicador de Lugar Automático
            if (dia) {
                lugarIndicador.classList.remove('hidden');
                if (dia.includes("Día 3")) {
                    lugarIndicador.textContent = "📍 Lugar: CrossFit";
                    lugarIndicador.className = "text-xs font-bold mt-2 px-3 py-1.5 bg-surface border border-border rounded-lg inline-block text-accent";
                } else {
                    lugarIndicador.textContent = "📍 Lugar: Gym";
                    lugarIndicador.className = "text-xs font-bold mt-2 px-3 py-1.5 bg-surface border border-border rounded-lg inline-block text-neon";
                }
            } else {
                lugarIndicador.classList.add('hidden');
            }

            // Actualizar Ejercicios Disponibles
            selEj.innerHTML = '<option value="" disabled selected>— Seleccionar ejercicio —</option>';
            if (fase && dia && RUTINAS[fase] && RUTINAS[fase][dia]) {
                RUTINAS[fase][dia].forEach((ej, idx) => {
                    const opt = document.createElement('option');
                    opt.value = idx;
                    opt.textContent = ej.nombre;
                    selEj.appendChild(opt);
                });
                selEj.disabled = false;
            } else {
                selEj.disabled = true;
            }
            selEj.value = '';
            onEjercicioChange();
        }

        function onEjercicioChange() {
            const fase = document.getElementById('sel-fase').value;
            const dia = document.getElementById('sel-dia').value;
            const ejIdx = document.getElementById('sel-ejercicio').value;
            const btnCompletar = document.getElementById('btn-completar');

            if (dia && ejIdx !== "") {
                const ej = RUTINAS[fase][dia][ejIdx];
                btnCompletar.disabled = false;

                /* ___ INTERFAZ ADAPTATIVA (OCULTAR PESO) ___ */
                const contenedorGrid = document.getElementById('controles-grid');
                const contenedorPeso = document.getElementById('contenedor-peso');

                if (ej.peso) {
                    contenedorGrid.className = 'grid grid-cols-2 gap-4';
                    contenedorPeso.style.display = 'flex';
                } else {
                    contenedorGrid.className = 'grid grid-cols-1 gap-4';
                    contenedorPeso.style.display = 'none';
                }

                /* ___ TEMPORIZADOR INTELIGENTE ___ */
                setTimer(ej.descanso);

            } else {
                btnCompletar.disabled = true;
            }
        }

        /* ══════════════ AJUSTAR PESO & REPS ══════════════ */
        function ajustar(campo, delta) {
            if (campo === 'peso') {
                peso = Math.max(0, parseFloat((peso + delta).toFixed(1)));
                document.getElementById('val-peso').textContent = peso % 1 === 0 ? peso : peso.toFixed(1);
            } else {
                reps = Math.max(1, reps + delta);
                document.getElementById('val-reps').textContent = reps;
            }
        }

        /* ══════════════ COMPLETAR SERIE ══════════════ */
        function completarSerie() {
            const fase = document.getElementById('sel-fase').value;
            const dia = document.getElementById('sel-dia').value;
            const ejIdx = document.getElementById('sel-ejercicio').value;
            if (!dia || ejIdx === "") return;

            const ej = RUTINAS[fase][dia][ejIdx];

            // Formateos para visualización limpia
            const nombreFaseCorto = fase.split(':')[0]; // Ejemplo: "Fase 1"
            const nombreDiaCorto = dia.split(':')[0];   // Ejemplo: "Día 1"

            const registro = {
                id: Date.now(),
                fecha: fechaHoy(),
                fase: nombreFaseCorto,
                dia: nombreDiaCorto,
                ejercicio: ej.nombre,
                peso: ej.peso ? peso : null, // null significa "Corporal"
                repeticiones: reps
            };

            guardarRegistro(registro);
            renderHistorial();
            iniciarTimer();
            mostrarToast(`✅ Serie guardada: ${ej.peso ? peso + ' kg' : 'Corporal'} × ${reps} reps`);
        }

        /* ══════════════ LOCALSTORAGE ══════════════ */
        const LS_KEY = 'gymtracker_series';
        function cargarRegistros() { try { return JSON.parse(localStorage.getItem(LS_KEY)) || []; } catch { return []; } }
        function guardarRegistro(r) {
            const d = cargarRegistros(); d.push(r);
            localStorage.setItem(LS_KEY, JSON.stringify(d));
        }
        function registrosDeHoy() { return cargarRegistros().filter(r => r.fecha === fechaHoy()).reverse(); }

        function borrarHistorialHoy() {
            localStorage.setItem(LS_KEY, JSON.stringify(cargarRegistros().filter(r => r.fecha !== fechaHoy())));
            renderHistorial();
            mostrarToast('🗑 Historial borrado');
        }
        function confirmarBorrarHistorial() { if (confirm('¿Borrar todo el historial de hoy?')) borrarHistorialHoy(); }

        /* ══════════════ RENDER HISTORIAL ══════════════ */
        function renderHistorial() {
            const lista = document.getElementById('historial-lista'), empty = document.getElementById('historial-empty');
            const series = registrosDeHoy();
            lista.innerHTML = '';

            if (series.length === 0) { empty.classList.remove('hidden'); return; }
            empty.classList.add('hidden');

            series.forEach((r, idx) => {
                const num = series.length - idx;
                const div = document.createElement('div');
                div.className = 'flex items-center justify-between bg-card border border-border rounded-xl px-4 py-3 gap-3';

                // Formateo del Peso guardado
                const pesoHTML = r.peso !== null
                    ? `<p class="text-base font-black text-neon">${r.peso} <span class="text-xs font-normal text-gray-400">kg</span></p>`
                    : `<p class="text-base font-black text-neon uppercase text-[10px] tracking-widest pt-1">Corporal</p>`;

                div.innerHTML = `
          <div class="flex items-center gap-3 min-w-0">
            <span class="text-xs font-bold text-gray-500 w-5 text-center shrink-0">#${num}</span>
            <div class="min-w-0">
              <p class="text-sm font-semibold text-white truncate">${r.ejercicio}</p>
              <p class="text-xs text-gray-500 truncate">${r.fase} - ${r.dia}</p>
            </div>
          </div>
          <div class="flex items-center gap-3 shrink-0">
            <div class="text-right">
              ${pesoHTML}
              <p class="text-xs text-gray-400">${r.repeticiones} reps</p>
            </div>
            <button onclick="borrarSerie(${r.id})" class="text-gray-700 hover:text-red-500 transition-colors text-lg leading-none p-1">✕</button>
          </div>
        `;
                lista.appendChild(div);
            });
        }

        function borrarSerie(id) {
            localStorage.setItem(LS_KEY, JSON.stringify(cargarRegistros().filter(r => r.id !== id)));
            renderHistorial();
        }

        /* ══════════════ TEMPORIZADOR ══════════════ */
        function setTimer(segundos) {
            timerDefault = segundos;
            // Solo actualizamos el display visual si el temporizador no está corriendo
            if (!timerRunning) {
                timerSeg = segundos;
                document.getElementById('timer-texto').textContent = timerSeg;
            }
        }

        function iniciarTimer() {
            if (timerInterval) clearInterval(timerInterval);
            timerSeg = timerDefault; timerRunning = true;
            document.getElementById('timer-texto').textContent = timerSeg;
            const d = document.getElementById('timer-display');
            d.classList.add('timer-active'); d.style.borderColor = '#39FF14';

            timerInterval = setInterval(() => {
                timerSeg--; document.getElementById('timer-texto').textContent = timerSeg;
                if (timerSeg <= 10) { d.classList.remove('timer-active'); d.classList.add('timer-warning'); d.style.borderColor = '#ef4444'; }
                if (timerSeg <= 0) {
                    clearInterval(timerInterval); timerRunning = false;
                    d.classList.remove('timer-active', 'timer-warning'); d.style.borderColor = '';
                    mostrarToast('⏰ ¡Terminó tu descanso! A tu posición.');
                    if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
                }
            }, 1000);
        }

        /* ══════════════ TOAST ══════════════ */
        let toastTimeout;
        function mostrarToast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg; t.classList.remove('opacity-0'); t.classList.add('opacity-100');
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => { t.classList.remove('opacity-100'); t.classList.add('opacity-0'); }, 2500);
        }

        /* ══════════════ INIT ══════════════ */
        mostrarFecha();
        renderHistorial();

        /* ══════════════ SERVICE WORKER (PWA) ══════════════ */
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('Service Worker registrado', reg.scope))
                    .catch(err => console.warn('Error SW', err));
            });
        }
    </script>
</body>
